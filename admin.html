<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Upload Struk</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200 p-8">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold text-center mb-6">Dashboard Admin Struk</h1>
        
        <!-- Area Login -->
        <div id="login-area" class="mb-6">
            <input type="password" id="password" placeholder="Masukkan Password Admin" class="w-full border p-2 rounded mb-3">
            <button onclick="login()" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Masuk</button>
        </div>

        <!-- Area Dashboard Utama (Awalnya Sembunyi) -->
        <div id="dashboard-area" class="hidden">
            <div class="bg-blue-50 p-4 rounded mb-6 border border-blue-200">
                <h2 class="font-bold mb-2">1. Buat Folder Instansi Baru</h2>
                <div class="flex gap-2">
                    <input type="text" id="new-folder-name" placeholder="Nama Instansi (Cth: KUA)" class="flex-1 border p-2 rounded">
                    <button onclick="createFolder()" id="btn-folder" class="bg-blue-600 text-white px-4 py-2 rounded">Buat Folder</button>
                </div>
            </div>

            <div class="bg-green-50 p-4 rounded border border-green-200">
                <h2 class="font-bold mb-2">2. Upload Struk PDF</h2>
                <select id="folder-select" class="w-full border p-2 rounded mb-3">
                    <option value="">Pilih Folder Instansi...</option>
                </select>
                <input type="file" id="file-input" accept="application/pdf" class="w-full border p-2 rounded mb-3 bg-white">
                <button onclick="uploadFile()" id="btn-upload" class="w-full bg-green-600 text-white p-2 rounded font-bold">Upload PDF</button>
            </div>
        </div>
    </div>

    <script>
        // GANTI TULISAN DI BAWAH INI DENGAN URL WEB APP GOOGLE SCRIPT ANDA
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx3GQNc9k36TF7gWfGIGFpmHTAwMxB72FjPxCk9qbmA4mMszdOzr0vQEqmPX6jqCGXlkQ/exec";
        let adminPass = "";

        // Fungsi Login & Ambil Folder
        function login() {
            adminPass = document.getElementById('password').value;
            if(!adminPass) return alert("Masukkan password!");
            
            document.getElementById('login-area').classList.add('hidden');
            document.getElementById('dashboard-area').classList.remove('hidden');
            loadFolders();
        }

        // Memuat dropdown folder
        function loadFolders() {
            fetch(SCRIPT_URL + "?action=getFolders")
                .then(res => res.json())
                .then(data => {
                    const select = document.getElementById('folder-select');
                    select.innerHTML = '<option value="">Pilih Folder Instansi...</option>';
                    data.data.forEach(folder => {
                        select.innerHTML += `<option value="${folder.id}">${folder.name}</option>`;
                    });
                });
        }

        // Fungsi Buat Folder
        function createFolder() {
            const name = document.getElementById('new-folder-name').value;
            if(!name) return alert("Isi nama folder!");
            const btn = document.getElementById('btn-folder');
            btn.innerText = "Memproses...";
            
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'createFolder', password: adminPass, folderName: name })
            }).then(res => res.json()).then(res => {
                alert(res.message);
                btn.innerText = "Buat Folder";
                document.getElementById('new-folder-name').value = '';
                if(res.status === 'success') loadFolders(); // Refresh dropdown
            });
        }

        // Fungsi Upload PDF
        function uploadFile() {
            const folderId = document.getElementById('folder-select').value;
            const fileInput = document.getElementById('file-input');
            
            if(!folderId) return alert("Pilih folder terlebih dahulu!");
            if(fileInput.files.length === 0) return alert("Pilih file PDF!");

            const file = fileInput.files[0];
            const btn = document.getElementById('btn-upload');
            btn.innerText = "Mengunggah... Mohon tunggu";
            
            const reader = new FileReader();
            reader.onload = function(e) {
                // Hapus awalan data:application/pdf;base64, agar bisa dibaca Apps Script
                const base64Data = e.target.result.split(',')[1];
                
                fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ 
                        action: 'uploadFile', 
                        password: adminPass, 
                        folderId: folderId, 
                        fileName: file.name, 
                        base64: base64Data 
                    })
                }).then(res => res.json()).then(res => {
                    alert(res.message);
                    btn.innerText = "Upload PDF";
                    fileInput.value = '';
                }).catch(err => {
                    alert("Error: Pastikan ukuran PDF tidak terlalu besar (maks ~3MB)");
                    btn.innerText = "Upload PDF";
                });
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
