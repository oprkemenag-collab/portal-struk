<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Unduh Struk</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-center text-blue-600 mb-8">Portal Arsip Struk Pelanggan</h1>
        
        <!-- Area Kategori/Folder -->
        <div id="folder-view">
            <h2 class="text-xl font-semibold mb-4">Pilih Instansi/Kategori:</h2>
            <div id="loading-folders" class="text-gray-500">Memuat data folder...</div>
            <div id="folder-container" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- Folder akan muncul di sini -->
            </div>
        </div>

        <!-- Area File Struk (Awalnya Sembunyi) -->
        <div id="file-view" class="hidden">
            <button onclick="backToFolders()" class="mb-4 bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">&larr; Kembali ke Folder</button>
            <h2 id="folder-title" class="text-xl font-semibold mb-4">Daftar Struk</h2>
            <div id="loading-files" class="text-gray-500 hidden">Memuat struk...</div>
            <div id="file-container" class="space-y-3">
                <!-- File PDF akan muncul di sini -->
            </div>
        </div>
    </div>

    <script>
        // GANTI TULISAN DI BAWAH INI DENGAN URL WEB APP GOOGLE SCRIPT ANDA
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx3GQNc9k36TF7gWfGIGFpmHTAwMxB72FjPxCk9qbmA4mMszdOzr0vQEqmPX6jqCGXlkQ/exec";

        // Ambil Daftar Folder saat web dibuka
        fetch(SCRIPT_URL + "?action=getFolders")
            .then(res => res.json())
            .then(data => {
                document.getElementById('loading-folders').classList.add('hidden');
                const container = document.getElementById('folder-container');
                data.data.forEach(folder => {
                    container.innerHTML += `
                        <div onclick="openFolder('${folder.id}', '${folder.name}')" 
                             class="bg-white p-6 rounded-lg shadow cursor-pointer hover:shadow-md border-t-4 border-blue-500 transition">
                            <h3 class="text-lg font-bold text-gray-800">📁 ${folder.name}</h3>
                        </div>
                    `;
                });
            });

        // Buka Folder dan Ambil File
        function openFolder(folderId, folderName) {
            document.getElementById('folder-view').classList.add('hidden');
            document.getElementById('file-view').classList.remove('hidden');
            document.getElementById('folder-title').innerText = "Struk Instansi: " + folderName;
            document.getElementById('file-container').innerHTML = '';
            document.getElementById('loading-files').classList.remove('hidden');

            fetch(SCRIPT_URL + "?action=getFiles&folderId=" + folderId)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('loading-files').classList.add('hidden');
                    const container = document.getElementById('file-container');
                    if(data.data.length === 0) {
                        container.innerHTML = '<p class="text-gray-500">Belum ada struk di folder ini.</p>';
                    }
                    data.data.forEach(file => {
                        container.innerHTML += `
                            <div class="bg-white p-4 rounded shadow flex justify-between items-center">
                                <span class="font-medium text-gray-700">📄 ${file.name}</span>
                                <a href="${file.url}" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 transition">Download</a>
                            </div>
                        `;
                    });
                });
        }

        // Tombol Kembali
        function backToFolders() {
            document.getElementById('file-view').classList.add('hidden');
            document.getElementById('folder-view').classList.remove('hidden');
        }
    </script>
</body>
</html>
